name: Single-player preview
on:
  push:
    branches: [codex/integrated-singleplayer]
  pull_request:
    paths: ['server-runtime/**', 'scripts/*singleplayer*', 'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/server/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: singleplayer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :app_pojavlauncher:testDebugUnitTest :app_pojavlauncher:assembleDebug --no-daemon
      - name: Test headless startup, cache handshake, shutdown and restart
        run: python3 scripts/test-singleplayer.py
      - name: Verify preview APK
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009Scape-singleplayer-preview-1.apk
          python3 scripts/verify_release.py out/2009Scape-singleplayer-preview-1.apk --build-tools "$ANDROID_HOME/build-tools/33.0.2" --version hd-3.3-singleplayer-preview.1 --version-code 9950003
          python3 scripts/verify-singleplayer.py out/2009Scape-singleplayer-preview-1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: singleplayer-preview-1
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singleplayer-test-reports
          path: |
            app_pojavlauncher/build/test-results/
            app_pojavlauncher/build/singleplayer-test/*.log
          if-no-files-found: ignore
