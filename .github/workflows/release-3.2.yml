name: Release 3.2

on:
  push:
    branches: [master]
    paths:
      - docs/releases/3.2.md
      - .github/workflows/release-3.2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3.2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install matching Android toolchain
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :app_pojavlauncher:testDebugUnitTest :app_pojavlauncher:assembleDebug --no-daemon
      - name: Verify APK and create checksum
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009Scape-HD-3.2-debug.apk
          python3 scripts/verify_release.py out/2009Scape-HD-3.2-debug.apk \
            --build-tools "$ANDROID_HOME/build-tools/33.0.2" \
            --version hd-3.2 --version-code 9950002
      - uses: actions/upload-artifact@v4
        with:
          name: release-3.2
          path: out/*
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-test-reports-3.2
          path: app_pojavlauncher/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.repository == 'Russianranger/2009Scape-mobile'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-3.2
          path: out
      - name: Verify downloaded checksum
        working-directory: out
        run: sha256sum --check 2009Scape-HD-3.2-debug.apk.sha256
      - name: Publish version 3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hd-3.2 \
            out/2009Scape-HD-3.2-debug.apk \
            out/2009Scape-HD-3.2-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Release 3.2' \
            --notes-file docs/releases/3.2.md
