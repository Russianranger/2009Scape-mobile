name: Android 15 client exercise
on:
  push:
    branches: ['ci/odin-client-android15']
permissions:
  contents: read
  actions: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: hd
            source: draw-probe
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/client-exercise/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wait for candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 65); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/45463048131/artifacts" --jq '.artifacts[].name' | grep -Fx tested-candidate-apk && break
            sleep 8
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45463048131
          github-token: ${{ github.token }}
          name: tested-candidate-apk
      - name: Instrument Java LWJGL draw dispatches for the disposable HD test
        if: matrix.source == 'draw-probe'
        run: |
          unzip -p client.apk assets/components/lwjgl3/lwjgl-glfw-classes.jar > draw-probe.jar
          mkdir -p probeclasses
          javac --release 8 -cp draw-probe.jar -d probeclasses .github/client-exercise/DrawProbe.java
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -d probeclasses .github/client-exercise/Patch.java
          cd probeclasses
          jar xf ../draw-probe.jar org/lwjgl/opengl/GL11C.class
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -cp . Patch org/lwjgl/opengl/GL11C.class
          jar uf ../draw-probe.jar scapeprobe/DrawProbe.class org/lwjgl/opengl/GL11C.class
      - name: Start Android API 35 emulator
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools' && break
            sleep 3
          done
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --path "$ANDROID_AVD_HOME/client.avd" --name client --package 'system-images;android-35;google_apis;x86_64' --force
          if [ ! -f "$ANDROID_AVD_HOME/client.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s/client.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" >"$ANDROID_AVD_HOME/client.ini"
          fi
          test -f "$ANDROID_AVD_HOME/client.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx client
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if ! command -v tesseract >/dev/null; then sudo apt-get -qq install -y tesseract-ocr; fi
          mkdir -p validation
          "$ANDROID_HOME/emulator/emulator" -avd client -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -cores 2 -memory 4096 -partition-size 5000 >validation/emulator.txt 2>&1 </dev/null &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb root
          adb wait-for-device
          adb pull /vendor/lib64/libGLESv2_enc.so validation/libGLESv2_enc.so || true
          adb shell input keyevent 82
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell wm size 1280x720
          adb shell wm density 220
      - name: Start and inspect the offline client
        run: python3 .github/client-exercise/smoke.py "${{ matrix.mode }}" "${{ matrix.source }}"
      - name: Preserve process evidence if launch returned early
        if: always()
        run: |
          mkdir -p validation
          if timeout 8 adb get-state >/dev/null; then
            adb shell getprop ro.product.cpu.abilist >validation/abis.txt
            adb shell getprop ro.dalvik.vm.native.bridge >validation/bridge.txt
            if [ ! -s validation/logcat.txt ]; then adb logcat -d -t 6000 >validation/logcat.txt; fi
            if [ ! -s validation/exit-info.txt ]; then adb shell dumpsys activity exit-info net.kdt.pojavlaunch.debug >validation/exit-info.txt; fi
            adb exec-out screencap -p >validation/final.png
            adb shell run-as net.kdt.pojavlaunch.debug sh -c '"cat files/client-diagnostics/*.log"' >validation/startup.txt || true
            rg -i 'signal 11|fatal signal|fatal exception|client JVM|cannot load|exception in thread|ANR in' validation/logcat.txt | tail -20 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.source }}-${{ matrix.mode }}
          path: validation/
          retention-days: 5
